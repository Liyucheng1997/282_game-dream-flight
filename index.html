<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦中飞行</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; user-select: none; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* 目标清单 */
  #objectives {
    position: absolute; top: 18px; left: 18px;
    background: rgba(8, 10, 30, 0.55); border: 1px solid rgba(140, 150, 255, 0.25);
    border-radius: 10px; padding: 12px 16px; color: #cfd4ff;
    font-size: 14px; line-height: 1.9; backdrop-filter: blur(4px);
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
  #objectives h3 { font-size: 13px; color: #8f97d8; font-weight: normal; letter-spacing: 2px; margin-bottom: 4px; }
  #objectives .obj.done { color: #7fe8a8; }
  #objectives .obj.done::before { content: "✓ "; }
  #objectives .obj.todo { color: #cfd4ff; opacity: 0.85; }
  #objectives .obj.todo::before { content: "○ "; }
  #objectives .obj.locked { color: #555a80; opacity: 0.6; }
  #objectives .obj.locked::before { content: "· "; }

  /* 控制提示 */
  #controls {
    position: absolute; top: 18px; right: 18px; text-align: right;
    background: rgba(8, 10, 30, 0.55); border: 1px solid rgba(140, 150, 255, 0.25);
    border-radius: 10px; padding: 12px 16px; color: #aab2e8;
    font-size: 13px; line-height: 1.9; backdrop-filter: blur(4px);
  }
  #controls b { color: #ffe9a8; font-weight: normal; }

  /* 中央消息 */
  #message {
    position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 30px; letter-spacing: 4px; text-align: center;
    text-shadow: 0 0 18px rgba(150, 160, 255, 0.9), 0 2px 6px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.6s; white-space: nowrap;
  }
  #submessage {
    position: absolute; top: calc(26% + 46px); left: 50%; transform: translateX(-50%);
    color: #b9c1ff; font-size: 16px; letter-spacing: 2px; text-align: center;
    text-shadow: 0 1px 5px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.6s; white-space: nowrap;
  }

  /* 梦力条 */
  #powerWrap {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    width: 320px; display: none; text-align: center;
  }
  #powerWrap .label { color: #cfd4ff; font-size: 13px; letter-spacing: 3px; margin-bottom: 6px; text-shadow: 0 1px 4px #000; }
  #powerBar {
    height: 12px; border-radius: 6px; overflow: hidden;
    background: rgba(20, 25, 60, 0.7); border: 1px solid rgba(150, 160, 255, 0.4);
  }
  #powerFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4fc3f7, #b39dff, #ff9de2);
    box-shadow: 0 0 12px rgba(170, 150, 255, 0.9);
    transition: width 0.15s;
  }

  /* 高度表 */
  #altimeter {
    position: absolute; left: 22px; bottom: 40px; display: none;
    color: #9fd8ff; font-size: 14px; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
  #altimeter .num { font-size: 30px; color: #e6f4ff; }

  /* 全屏遮罩（开场 / 被抓 / 梦醒） */
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; pointer-events: auto;
  }
  #startOverlay { background: radial-gradient(ellipse at center, rgba(20,22,55,0.92), rgba(4,4,14,0.98)); }
  #startOverlay h1 { font-size: 52px; letter-spacing: 14px; margin-bottom: 14px;
    text-shadow: 0 0 30px rgba(150,160,255,0.8); font-weight: normal; }
  #startOverlay p { color: #aab2e8; font-size: 16px; line-height: 2.1; letter-spacing: 1px; }
  #startOverlay .story { max-width: 560px; margin-bottom: 26px; }
  #startOverlay .key { color: #ffe9a8; }
  #startOverlay .press { margin-top: 30px; font-size: 18px; color: #fff; animation: blink 1.4s infinite; letter-spacing: 3px; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  #caughtOverlay { background: rgba(60, 0, 10, 0.75); display: none; }
  #caughtOverlay h1 { font-size: 40px; letter-spacing: 8px; text-shadow: 0 0 24px #f00; font-weight: normal; }
  #caughtOverlay p { margin-top: 14px; color: #ffb9c0; font-size: 16px; letter-spacing: 2px; }

  #endOverlay { background: radial-gradient(ellipse at center, rgba(255,240,210,0.16), rgba(10,10,25,0.9)); display: none; }
  #endOverlay h1 { font-size: 46px; letter-spacing: 12px; text-shadow: 0 0 28px rgba(255,230,170,0.9); font-weight: normal; }
  #endOverlay .stats { margin-top: 22px; color: #e8e2ff; font-size: 17px; line-height: 2.3; letter-spacing: 2px; }
  #endOverlay .press { margin-top: 30px; font-size: 16px; color: #ffe9a8; animation: blink 1.4s infinite; letter-spacing: 3px; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(2,2,10,0.55) 100%);
  }
</style>
</head>
<body>
  <div id="vignette"></div>

  <div id="hud">
    <div id="objectives">
      <h3>梦境目标</h3>
      <div class="obj" id="obj-lake">逃到湖边，跳进水里</div>
      <div class="obj" id="obj-power">游泳，积攒梦力</div>
      <div class="obj" id="obj-fly">飞起来！</div>
      <div class="obj" id="obj-high">越飞越高（50 米以上）</div>
      <div class="obj" id="obj-roof">落在最高的楼顶上</div>
      <div class="obj" id="obj-tree">站上一棵树的树尖</div>
      <div class="obj" id="obj-jumps">树尖连跳 5 棵树</div>
    </div>
    <div id="controls"></div>
    <div id="message"></div>
    <div id="submessage"></div>
    <div id="powerWrap">
      <div class="label">梦 力</div>
      <div id="powerBar"><div id="powerFill"></div></div>
    </div>
    <div id="altimeter">高度<br><span class="num">0</span> 米</div>
  </div>

  <div class="overlay" id="startOverlay">
    <h1>梦 中 飞 行</h1>
    <p class="story">
      又是那个梦。<br>
      身后是追来的僵尸和鬼，前方是一片湖。<br>
      你记得梦里的秘密：只要游泳，游着游着——<br>
      就能用游泳的姿势，飞起来。
    </p>
    <p>
      <span class="key">W A S D</span> 移动 &nbsp;·&nbsp; <span class="key">空格</span> 跳跃 / 划水飞行 &nbsp;·&nbsp; <span class="key">Shift</span> 下降
    </p>
    <p class="press">—— 按 回车 键 入梦 ——</p>
  </div>

  <div class="overlay" id="caughtOverlay">
    <h1>被 抓 住 了 ……</h1>
    <p>心跳加速，梦境重新开始了。快跑向湖边！</p>
  </div>

  <div class="overlay" id="endOverlay">
    <h1>天 亮 了</h1>
    <div class="stats" id="endStats"></div>
    <p class="press">—— 按 回车 键 继续做梦（自由飞行） ——</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js" } }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
