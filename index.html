<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦中飞行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e8ebff;
    --dim: #9aa3d8;
    --faint: #5a6190;
    --gold: #ffe3a3;
    --glass: rgba(10, 12, 34, 0.42);
    --edge: rgba(170, 180, 255, 0.18);
    --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --sans: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #03040c; }
  body { font-family: var(--sans); user-select: none; color: var(--ink); }
  canvas { display: block; width: 100vw !important; height: 100vh !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; opacity: 0; transition: opacity 1.5s; }
  #hud.show { opacity: 1; }

  .panel {
    background: var(--glass); border: 1px solid var(--edge); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #objectives { position: absolute; top: 20px; left: 20px; padding: 14px 18px; font-size: 13.5px; line-height: 2; min-width: 220px; }
  #objectives h3 { font-family: var(--serif); font-weight: 300; font-size: 12px; color: var(--dim); letter-spacing: 6px; margin-bottom: 4px; }
  .obj { transition: color 0.6s, opacity 0.6s; }
  .obj::before { display: inline-block; width: 1.4em; }
  .obj.done { color: #9ff0c4; }
  .obj.done::before { content: "✦"; }
  .obj.todo { color: var(--ink); }
  .obj.todo::before { content: "◇"; color: var(--gold); }
  .obj.locked { color: var(--faint); opacity: 0.7; }
  .obj.locked::before { content: "·"; }

  #controls { position: absolute; top: 20px; right: 20px; text-align: right; padding: 14px 18px; font-size: 12.5px; line-height: 2; color: var(--dim); }
  #controls b { color: var(--gold); font-weight: normal; }
  #controls .mute { color: var(--faint); font-size: 11.5px; }

  #message, #submessage { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.7s; white-space: nowrap; }
  #message { top: 24%; font-family: var(--serif); font-weight: 500; font-size: 34px; letter-spacing: 6px;
    text-shadow: 0 0 24px rgba(160, 170, 255, 0.85), 0 2px 8px rgba(0,0,0,0.9); }
  #submessage { top: calc(24% + 54px); font-size: 15px; letter-spacing: 2px; color: #c4caff; text-shadow: 0 1px 6px rgba(0,0,0,0.95); }

  #powerWrap { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); width: 340px; text-align: center; opacity: 0; transition: opacity 0.8s; }
  #powerWrap.show { opacity: 1; }
  #powerWrap .label { font-family: var(--serif); font-size: 13px; letter-spacing: 8px; margin-bottom: 8px; color: var(--ink); text-shadow: 0 1px 4px #000; }
  #powerBar { height: 6px; border-radius: 3px; overflow: hidden; background: rgba(20, 25, 60, 0.6); border: 1px solid rgba(160, 170, 255, 0.3); }
  #powerFill { height: 100%; width: 0%; background: linear-gradient(90deg, #6fd3ff, #b8a4ff, #ffb0e6); box-shadow: 0 0 14px rgba(180, 160, 255, 1); transition: width 0.15s; }

  #altimeter { position: absolute; left: 26px; bottom: 40px; opacity: 0; transition: opacity 1s; color: var(--dim); font-size: 12px; letter-spacing: 3px; text-shadow: 0 0 8px rgba(0,0,0,0.9); }
  #altimeter.show { opacity: 1; }
  #altimeter .num { font-family: var(--serif); font-weight: 300; font-size: 40px; color: var(--ink); letter-spacing: 1px; }

  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity 1.4s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  #startOverlay { background: radial-gradient(ellipse at 50% 55%, rgba(8,10,30,0.25), rgba(3,4,12,0.85) 80%); cursor: pointer; }
  #startOverlay h1 { font-family: var(--serif); font-weight: 300; font-size: 64px; letter-spacing: 22px; margin-bottom: 26px; padding-left: 22px;
    text-shadow: 0 0 40px rgba(150,160,255,0.8), 0 0 90px rgba(120,130,255,0.4); animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
  #startOverlay .story { font-family: var(--serif); font-weight: 300; color: #c4caf0; font-size: 17px; line-height: 2.2; letter-spacing: 2px; max-width: 560px; margin-bottom: 30px; }
  #startOverlay .keys { color: var(--dim); font-size: 14px; letter-spacing: 1px; line-height: 2; }
  #startOverlay .key { color: var(--gold); }
  #loading { margin-top: 36px; width: 260px; transition: opacity 0.8s; }
  #loading.hidden { opacity: 0; }
  #loading .bar { height: 2px; background: rgba(160,170,255,0.15); border-radius: 1px; overflow: hidden; }
  #loadFill { height: 100%; width: 0; background: linear-gradient(90deg, #6fd3ff, #c8b0ff); box-shadow: 0 0 10px #a8b0ff; transition: width 0.3s; }
  #loadText { margin-top: 10px; font-size: 12px; color: var(--faint); letter-spacing: 3px; }
  #pressStart { margin-top: -30px; font-family: var(--serif); font-size: 18px; letter-spacing: 6px; color: #fff; opacity: 0; transition: opacity 1s; }
  #pressStart.show { opacity: 1; animation: blink 2.2s ease-in-out 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  #caughtOverlay { background: radial-gradient(ellipse at center, rgba(90,0,10,0.55), rgba(30,0,4,0.92)); opacity: 0; pointer-events: none; transition: opacity 0.35s; }
  #caughtOverlay.show { opacity: 1; }
  #caughtOverlay h1 { font-family: var(--serif); font-weight: 500; font-size: 44px; letter-spacing: 12px; text-shadow: 0 0 30px #f22; }
  #caughtOverlay p { margin-top: 16px; color: #ffc0c6; font-size: 15px; letter-spacing: 3px; }

  #endOverlay { background: radial-gradient(ellipse at 50% 60%, rgba(255,220,180,0.1), rgba(40,20,30,0.7)); opacity: 0; pointer-events: none; cursor: pointer; }
  #endOverlay.show { opacity: 1; pointer-events: auto; }
  #endOverlay h1 { font-family: var(--serif); font-weight: 300; font-size: 60px; letter-spacing: 20px; padding-left: 20px; text-shadow: 0 0 40px rgba(255,220,160,0.9); }
  #endOverlay .stats { margin-top: 26px; font-family: var(--serif); font-weight: 300; color: #fff2e4; font-size: 17px; line-height: 2.2; letter-spacing: 2px; text-shadow: 0 1px 8px rgba(60,20,20,0.8); }
  #endOverlay .stats b { color: var(--gold); font-weight: 500; }
  #endOverlay .press { margin-top: 34px; font-size: 15px; color: var(--gold); letter-spacing: 4px; animation: blink 2.2s infinite; }

  @media (max-width: 720px) {
    #controls { display: none; }
    #startOverlay h1 { font-size: 40px; letter-spacing: 12px; }
    #message { font-size: 24px; }
  }
</style>
</head>
<body>
  <div id="hud">
    <div id="objectives" class="panel">
      <h3>梦 境</h3>
      <div class="obj" id="obj-lake">逃到湖边，跳进水里</div>
      <div class="obj" id="obj-power">游泳，积攒梦力</div>
      <div class="obj" id="obj-fly">飞起来！</div>
      <div class="obj" id="obj-high">越飞越高（50 米以上）</div>
      <div class="obj" id="obj-roof">落在最高的楼顶上</div>
      <div class="obj" id="obj-tree">站上一棵巨树的树尖</div>
      <div class="obj" id="obj-jumps">树尖连跳 5 棵树</div>
    </div>
    <div id="controls" class="panel"></div>
    <div id="message"></div>
    <div id="submessage"></div>
    <div id="powerWrap">
      <div class="label">梦 力</div>
      <div id="powerBar"><div id="powerFill"></div></div>
    </div>
    <div id="altimeter">高 度<br><span class="num">0</span> 米</div>
  </div>

  <div class="overlay" id="startOverlay">
    <h1>梦中飞行</h1>
    <p class="story">
      又是那个梦。<br>
      身后的坟一座座裂开，僵尸和鬼追了上来，前方是一片湖。<br>
      你记得梦里的秘密：只要游泳，游着游着——<br>
      就能用游泳的姿势，飞起来。
    </p>
    <p class="keys">
      <span class="key">W A S D</span> 移动 &nbsp;·&nbsp; <span class="key">空格</span> 跳跃 / 划水飞行 &nbsp;·&nbsp; <span class="key">Shift</span> 下降 &nbsp;·&nbsp; <span class="key">M</span> 静音
    </p>
    <div id="loading">
      <div class="bar"><div id="loadFill"></div></div>
      <div id="loadText">入梦中……</div>
    </div>
    <p id="pressStart">—— 按 回车 入梦 ——</p>
  </div>

  <div class="overlay" id="caughtOverlay">
    <h1>被抓住了……</h1>
    <p>心跳加速，梦境重新开始了。快跑向湖边！</p>
  </div>

  <div class="overlay" id="endOverlay">
    <h1>天亮了</h1>
    <div class="stats" id="endStats"></div>
    <p class="press">—— 按 回车 继续做梦（自由飞行）——</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
