# 推送 main 后自动发布到 GitHub Pages：npm ci 拉取 three，只带上用到的文件（保持 index.html 的 importmap 路径不变）
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: |
          mkdir -p _site/node_modules/three/build _site/node_modules/three/examples/jsm
          cp -r index.html src _site/
          cp node_modules/three/build/three.module.js _site/node_modules/three/build/
          cp -r node_modules/three/examples/jsm/{objects,postprocessing,shaders,utils} _site/node_modules/three/examples/jsm/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
